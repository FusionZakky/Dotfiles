wireplumber.settings = {
}
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3-platform-adl_mx98357_rt5682"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
        device.profile = "pro-audio"
      }
    }
  }
]
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*pro-output-[2-5]" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*pro-input-6" }
      { node.name = "~alsa_input.*pro-input-100" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*pro-output-0" }
    ]
    actions = {
      update-props = {
        node.description = "Speakers"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*pro-output-1" }
    ]
    actions = {
      update-props = {
        node.description = "Headset"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*pro-input-1" }
    ]
    actions = {
      update-props = {
        node.description = "Headset Microphone"
        priority.session = 900
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*pro-input-99" }
    ]
    actions = {
      update-props = {
        node.description = "Internal Microphone"
        priority.session = 1500
        priority.driver = 1500
      }
    }
  }
]
