input {
    touchdevice {
        enabled = true
        output = eDP-1
    }
}

decoration {
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
}

general {
    col.active_border = rgba(d9514eee) rgba(8f2f2dee) 45deg
    col.inactive_border = rgba(3a2422aa)
}

windowrulev2 = float, class:^(imv)$
windowrulev2 = center, class:^(imv)$
windowrulev2 = size 60% 60%, class:^(imv)$
windowrulev2 = dimaround, class:^(imv)$


windowrulev2 = float, class:^(org.pwmt.zathura)$
windowrulev2 = center, class:^(org.pwmt.zathura)$
windowrulev2 = size 45% 80%, class:^(org.pwmt.zathura)$
windowrulev2 = dimaround, class:^(org.pwmt.zathura)$


# HyprGlass: load plugin and apply its existing configuration at login
exec-once = /home/zakkaria/.local/bin/hyprglass-start.sh
